<body>
    <header>

            <a href="index.html">Home</a>

            <a href="work.html">Work</a>

    <main>
        <section>
            <H2>Welcome</H2>
            <p>Hello! My name is Ayyat.</p>
            <p> Welcome to my portfolio website. This website shows
                some of my projects, skills, and information about me.</p>
        </section>

        <section>
            <H2>Goals</H2>
            <p>I am learning HTML and web development.</p>
        </section>
        <section>
    <h2>Contact Me</h2>

    <form id="contactForm">

        <fieldset>
            <legend>Contact Information</legend>

            <div>
                <label for="name">Name:</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    required
                    aria-describedby="nameError"
                >

                <p id="nameError" class="error"></p>
            </div>

            <div>
                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    required
                    aria-describedby="emailError"
                >

                <p id="emailError" class="error"></p>
            </div>

            <div>
                <label for="message">Message:</label>
                <textarea 
                    id="message" 
                    name="message"
                    required
                    aria-describedby="messageError"
                ></textarea>

                <p id="messageError" class="error"></p>
            </div>

        </fieldset>

        <button type="submit">Send Message</button>

    </form>
</section>
    </main>

    <footer>
        <p>2026 My Portfolio</p>
    </footer>
    <script src="script.js"></script>
</body>
